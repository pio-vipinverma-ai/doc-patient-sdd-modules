name: Auto create PR from diff review

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  create-pr:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve branch and body file
        id: resolve
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          safe_branch="${branch//\//-}"
          pr_file=".github/reviewer-notes/${safe_branch}-pr.md"
          review_file=".github/reviewer-notes/${safe_branch}-review.md"
          if [ -f "$pr_file" ]; then
            echo "body_file=$pr_file" >> $GITHUB_OUTPUT
          elif [ -f "$review_file" ]; then
            echo "body_file=$review_file" >> $GITHUB_OUTPUT
          else
            echo "No PR body or review note found for branch '$branch'."
            exit 0
          fi

      - name: Create pull request if none exists
        env:
          BODY_FILE: ${{ steps.resolve.outputs.body_file }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const branch = process.env.GITHUB_REF.replace("refs/heads/", "");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "main";
            const bodyPath = process.env.BODY_FILE;
            const body = fs.readFileSync(bodyPath, "utf8");
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              base,
              state: "open",
              per_page: 100
            });
            if (existing.data.length > 0) {
              return `Skipping PR creation: open PR already exists for branch ${branch}.`;
            }
            const title = `PR for ${branch}`;
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base,
              body
            });
            return `Created PR #${pr.data.number}: ${pr.data.html_url}`;
